apis:
- aid: channelseal:platform-api
  name: ChannelSeal Platform API
  description: Platform resources behind the ChannelSeal Interface Scorecard — services, service providers,
    channels (HTTP paths, Kafka topics, queues), applications, non-human identities (API keys, client IDs,
    service accounts, X.509 fingerprints), sensitive data elements, alerts, CloudEvents-shaped audit events,
    dashboard discovery metrics, and Spring Boot Actuator health/metrics endpoints. OpenAPI 3.1.0, version
    0.1.0, 56 operations over 32 paths, RFC 9457 application/problem+json errors, Spring Data page/size/sort
    pagination.
  humanURL: https://docs.channelseal.com/platform
  baseURL: https://api.channelseal.com/platform
