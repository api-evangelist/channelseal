- aid: channelseal:api-catalog-api
  name: ChannelSeal API Catalog API
  description: Import API specifications into the ChannelSeal platform (POST /v1/api-specifications/import with an
    ImportContext), plus Spring Boot Actuator health for the catalog service. OpenAPI 3.1.0, version 0.1.0,
    3 operations. Served from a separate /catalog capability path.
  humanURL: https://docs.channelseal.com/catalog
  baseURL: https://api.channelseal.com/catalog
