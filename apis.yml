- aid: channelseal:data-classification-api
  name: ChannelSeal Data Classification API
  description: Manage the data-classification vocabulary the scorecard scores against — sensitive info types
    (data type, format, pattern match, jurisdiction, risk), sensitive info groups (PII, Financial, Health) and
    classification levels within a scheme. OpenAPI 3.1.0, version 0.1.0, 19 operations over 7 paths.
