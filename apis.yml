- aid: channelseal:api-discovery-service-api
  name: ChannelSeal API Discovery Service API
  description: Discover and manage API registry entries — get, list, search, update and delete discovered or
    registered API specifications (OpenAPI, AsyncAPI, GraphQL, WSDL, gRPC and others) with their security
    scheme, ownership, source and service-provider metadata. OpenAPI 3.1.0, version 0.1.0, 6 operations.
  humanURL: https://docs.channelseal.com/api-discovery
  baseURL: https://api.channelseal.com/platform
