    tenant, not on a channelseal.com host.
- id: oidc
  conforms: true
  evidence: >-
    OpenID Connect discovery served at https://dev-channelseal.us.auth0.com/.well-known/openid-configuration
    (200). Used for portal login; the APIs themselves take client-credentials bearer tokens.
- id: rfc9457-problem-details
  conforms: true
