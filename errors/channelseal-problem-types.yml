source: >-
  Derived from the 4xx/5xx responses in openapi/*.yml (every error response is application/problem+json
  with the shared ProblemDetail schema — type, title, status, detail, instance, properties), enriched with
  the docs' error reference at https://docs.channelseal.com/api-reference#error-handling, which publishes
  the problem-type URI scheme (https://api.channelseal.com/problems/<slug>), the status-code table and
  worked examples with extension members.
docs: https://docs.channelseal.com/api-reference#error-handling
envelope:
  media_type: application/problem+json
  schema: openapi/channelseal-api-schemas-openapi.yml#/components/schemas/ProblemDetail
  shape: '{ "type": uri, "title": string, "status": integer, "detail": string, "instance": uri, ...extensions }'
  extension_members:
    errors: array of {field, message, code, rejected_value?, allowed_values?} on validation failures (docs example)
    retry_after: seconds, on 429 (docs example; also sent as the Retry-After header)
    trace_id: uuid on 500 — "Include the trace_id when contacting support"
    conflicting_resource: id of the existing resource on 409 (docs example)
    properties: free-form map declared on ProblemDetail in the spec
type_uri_scheme: https://api.channelseal.com/problems/{slug}
