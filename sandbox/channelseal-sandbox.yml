description: >-
  ChannelSeal separates environments by host rather than by key prefix or a test-mode flag: the docs
  name a UAT environment (uat.channelseal.com) alongside production (api.channelseal.com) for every
  capability, and the specs add a staging host. The same Auth0 client-credentials flow and the same
  scopes are used against every environment (only the audience/base URL changes), so there is no
  test-vs-live credential separation to record. No test fixtures, magic values, test clocks or trigger
  tooling are published; the docs portal's in-browser playground (Zudoku, playground enabled) sits behind
  portal sign-in.
