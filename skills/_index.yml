source: >-
  https://docs.channelseal.com/agent-skills (served as markdown at /agent-skills.md) plus the portal's
  route table. ChannelSeal PUBLISHES its own Agent Skills — 18 SKILL.md files (13 resource skills, 5
  process skills) following the agentskills.io specification, installed by copying each skill page's
  markdown into the agent's skills folder with CHANNELSEAL_BASE_URL and CHANNELSEAL_TOKEN set. The skill
  pages themselves are protectedRoutes (/skills/*) behind portal sign-in on the Auth0 tenant, so their
  bodies are NOT reproduced here; only the public introduction page and each skill's name/description
  frontmatter (which the portal exposes for skill selection) are recorded. The provider says it "would
  expose these and more skills in a github repository in future". The three files listed under
  generated_skills are API Evangelist-authored, grounded in operationIds verified in openapi/*.yml.
docs: https://docs.channelseal.com/agent-skills
